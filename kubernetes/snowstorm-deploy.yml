apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowstorm-deployment
  labels:
    app: snowstorm
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the Elasticsearch data directory is a hostPath
  # and Elasticsearch takes an exclusive lock on it. A rolling update would start the new pod
  # while the old one still holds that lock, so the new Elasticsearch would fail with
  # 'failed to obtain node locks' - and since it gates Snowstorm's start, the rollout would
  # never complete. Recreate stops the old pod first, at the cost of downtime during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: snowstorm
  template:
    metadata:
      labels:
        app: snowstorm
    spec:
      # Elasticsearch runs as a native sidecar (an initContainer with restartPolicy: Always,
      # GA in Kubernetes 1.29) so that it is started and its startupProbe has passed before
      # Snowstorm starts. Plain containers in a pod start in parallel, which left Snowstorm
      # crash-looping against a cluster that was not listening yet.
      initContainers:
      - name: snowstorm-elasticsearch
        restartPolicy: Always
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
        volumeMounts:
          - name: elasticsearch-data
            mountPath: /usr/share/elasticsearch/data
        ports:
        - containerPort: 9200
          protocol: TCP
        env:
        # Elasticsearch 8 onwards forms a cluster and enables security by default.
        # Single-node discovery and disabled security match the docker-compose.yml setup.
        # Enable xpack.security and give Snowstorm credentials if this is exposed beyond the cluster.
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms4g -Xmx4g"
        startupProbe:
          httpGet:
            path: /
            port: 9200
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /
            port: 9200
          periodSeconds: 30
          failureThreshold: 3
      containers:
      - name: snowstorm-front
        # Pinned to the release this manifest was written for. Snowstorm 12.0.0 requires
        # Elasticsearch 9; do not pair an older Snowstorm tag with the 9.x image above.
        image: snomedinternational/snowstorm:12.0.0
        env:
        # The Snowstorm image is built by Jib; its java entrypoint reads JAVA_TOOL_OPTIONS.
        # ES_JAVA_OPTS has no effect here. JAVA_TOOL_OPTIONS is split on whitespace, so
        # --add-opens must use its '=' form - the space-separated form fails to start the JVM.
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms2g -Xmx4g --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        args:
          # localhost, not the snowstorm-elasticsearch Service: both containers share this
          # pod, and the Service has no endpoints until the pod is Ready - which cannot
          # happen until Snowstorm has connected. The Service remains for external access.
          - "--elasticsearch.urls=http://localhost:9200"
      volumes:
      - name: elasticsearch-data
        hostPath:
          path: /srv/production/snowstorm-elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
    labels:
      app: snowstorm-front
    name: snowstorm-front
spec:
    ports:
      - port: 8080
        name: snowstorm-front
        targetPort: 8080
    selector:
      app: snowstorm
---
apiVersion: v1
kind: Service
metadata:
    labels:
      app: snowstorm-elasticsearch
    name: snowstorm-elasticsearch
spec:
    ports:
      - port: 9200
        name: snowstorm-elasticsearch
        targetPort: 9200
    selector:
      app: snowstorm
